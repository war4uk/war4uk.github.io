<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Траты Cursor, Railway и OpenAI.">
  <title>Траты подписок</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --ink: #1c1915;
      --muted: #5e584f;
      --paper: #f3ecdf;
      --card: #fffaf3;
      --line: #e3d6c4;
      --track: #e7dfd2;
      --rail: #9a3412;
      --sm: #9a3412;
      --vintage: #1d4e89;
      --kind: #3f6212;
      --travel: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      line-height: 1.45;
    }
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 72px;
    }
    header { margin-bottom: 28px; }
    .kicker {
      margin: 0 0 8px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }
    .when {
      margin: 10px 0 0;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 14px;
      min-height: 196px;
    }
    .card h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .figure {
      margin: 14px 0 2px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 30px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      min-height: 2.8em;
    }
    .track {
      margin-top: 14px;
      height: 10px;
      background: var(--track);
      border-radius: 99px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0;
      background: var(--rail);
      border-radius: inherit;
    }
    .card.empty .track {
      background: repeating-linear-gradient(-45deg, #efe6d8, #efe6d8 6px, #e4d8c6 6px, #e4d8c6 12px);
    }
    .quota { margin-top: 12px; }
    .quota-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
    }
    section { margin-top: 28px; }
    h3 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 560;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .project { padding: 16px 0 18px; border-bottom: 1px solid var(--line); }
    .project:first-child { padding-top: 2px; }
    .project:last-child { border-bottom: 0; padding-bottom: 2px; }
    .project h4 { margin: 0 0 12px; font-size: 18px; letter-spacing: -0.02em; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .month-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .month-total {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 22px;
      letter-spacing: -0.03em;
    }
    .stack {
      display: flex;
      height: 8px;
      margin: 8px 0;
      overflow: hidden;
      border-radius: 99px;
      background: var(--track);
    }
    .stack i { display: block; height: 100%; }
    .stack .rail { background: #9a3412; }
    .stack .ai { background: #1d4e89; }
    .fine { display: grid; gap: 2px; color: var(--muted); font-size: 13px; }
    .dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 99px; vertical-align: 1px; }
    .bar-row { display: grid; grid-template-columns: 168px 1fr 72px; gap: 10px; align-items: center; margin: 8px 0; }
    .bar-row span:last-child, .num {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .bar {
      height: 18px;
      background: var(--track);
      border-radius: 6px;
      overflow: hidden;
    }
    .bar i { display: block; height: 100%; border-radius: inherit; }
    .split { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--track); }
    .split i { display: block; height: 100%; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 10px; color: var(--muted); font-size: 14px; }
    .legend b { font-weight: 600; color: var(--ink); }
    .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: baseline; }
    th { color: var(--muted); font-weight: 560; font-size: 13px; }
    td.num, th.num { text-align: right; }
    .note { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .days { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
    .days i {
      flex: 1;
      min-width: 6px;
      background: #1d4e89;
      border-radius: 3px 3px 0 0;
      display: block;
    }
    a { color: var(--rail); }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr auto; }
      .bar-row .bar { grid-column: 1 / -1; }
      .card { min-height: 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">Cursor, Railway, OpenAI</p>
      <h1>Прогресс трат</h1>
      <p class="when" id="when"></p>
    </header>
    <div class="grid" id="meters"></div>
    <section id="days-section" hidden>
      <h3>OpenAI за период</h3>
      <div class="panel">
        <div class="days" id="days"></div>
        <p class="note" id="days-note"></p>
      </div>
    </section>
    <section>
      <h3 id="projects-title">Траты по проектам</h3>
      <div class="panel">
        <div id="projects"></div>
        <p class="note" id="pace"></p>
      </div>
    </section>
    <section>
      <h3>Оценка сервисов за 7 суток</h3>
      <div class="panel" style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th rowspan="2">Проект</th>
              <th rowspan="2">Сервис</th>
              <th class="num" colspan="2">Railway</th>
              <th class="num" colspan="2">OpenAI</th>
            </tr>
            <tr>
              <th class="num">7 суток</th>
              <th class="num">Сутки</th>
              <th class="num">7 суток</th>
              <th class="num">Сутки</th>
            </tr>
          </thead>
          <tbody id="services"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script id="spend" type="application/json">{"generatedAt": "2026-11-07T09:03:35Z", "displayTime": "7 ноября 2026, 13:03 (Тбилиси)", "window": {"hours": 168, "start": "2026-10-31T09:03:35Z", "end": "2026-11-07T09:03:35Z", "label": "31 октября 13:03 — 7 ноября 13:03 (Тбилиси)"}, "railway": {"status": "estimated", "plan": "Pro", "planFeeUsd": 20, "includedCreditFromLimitsApiUsd": 0, "publishedIncludedCreditUsd": 20, "weekUsd": 2.2294, "dayUsd": 0.3269, "averageDayUsd": 0.3185, "runRate30dUsd": 9.5546, "progressTargetUsd": 20.0, "components": {"cpu": 0.0135, "memory": 2.1386, "disk": 0.0748, "egress": 0.0025}, "projects": [{"name": "sm-tracker", "weekUsd": 0.7594, "dayUsd": 0.1014, "openai": true}, {"name": "vintage", "weekUsd": 0.5748, "dayUsd": 0.0917, "openai": true}, {"name": "generous-kindness", "weekUsd": 0.4704, "dayUsd": 0.068, "openai": true}, {"name": "travels-history", "weekUsd": 0.4248, "dayUsd": 0.0658, "openai": false}], "services": [{"project": "sm-tracker", "service": "pipeline", "openai": true, "weekUsd": 0.6898, "dayUsd": 0.0909, "weekParts": {"cpu": 0.0089, "memory": 0.6779, "disk": 0.003, "egress": 0.0}}, {"project": "vintage", "service": "web", "openai": true, "weekUsd": 0.4473, "dayUsd": 0.0733, "weekParts": {"cpu": 0.0, "memory": 0.4473, "disk": 0.0, "egress": 0.0}}, {"project": "travels-history", "service": "web", "openai": false, "weekUsd": 0.3009, "dayUsd": 0.0481, "weekParts": {"cpu": 0.0, "memory": 0.3009, "disk": 0.0, "egress": 0.0}}, {"project": "generous-kindness", "service": "42bot", "openai": true, "weekUsd": 0.2266, "dayUsd": 0.0331, "weekParts": {"cpu": 0.0, "memory": 0.2241, "disk": 0.0, "egress": 0.0025}}, {"project": "generous-kindness", "service": "Postgres-dev", "openai": false, "weekUsd": 0.1474, "dayUsd": 0.021, "weekParts": {"cpu": 0.0009, "memory": 0.1422, "disk": 0.0043, "egress": 0.0}}, {"project": "vintage", "service": "Postgres", "openai": false, "weekUsd": 0.1275, "dayUsd": 0.0184, "weekParts": {"cpu": 0.0014, "memory": 0.0945, "disk": 0.0316, "egress": 0.0}}, {"project": "travels-history", "service": "Postgres", "openai": false, "weekUsd": 0.1239, "dayUsd": 0.0177, "weekParts": {"cpu": 0.0014, "memory": 0.0908, "disk": 0.0317, "egress": 0.0}}, {"project": "generous-kindness", "service": "Postgres", "openai": false, "weekUsd": 0.0964, "dayUsd": 0.0139, "weekParts": {"cpu": 0.0009, "memory": 0.0913, "disk": 0.0042, "egress": 0.0}}, {"project": "sm-tracker", "service": "web", "openai": false, "weekUsd": 0.0696, "dayUsd": 0.0105, "weekParts": {"cpu": 0.0, "memory": 0.0696, "disk": 0.0, "egress": 0.0}}], "rates": {"source": "https://railway.com/pricing", "checked": "2026-11-07", "cpuUsdPerVcpuSecond": 7.72e-06, "memoryUsdPerGbSecond": 3.86e-06, "diskUsdPerGbSecond": 6e-08, "egressUsdPerGb": 0.05}}, "openai": {"status": "no_invoice", "projects": ["sm-tracker", "vintage", "generous-kindness"], "absent": ["travels-history"]}, "cursor": {"status": "no_invoice"}}</script>
  <script>
    const embedded = JSON.parse(document.getElementById("spend").textContent);
    const colors = {
      "sm-tracker": "#9a3412",
      "vintage": "#1d4e89",
      "generous-kindness": "#3f6212",
      "travels-history": "#0f766e"
    };
    const money = (n) => "$" + Number(n).toFixed(2);

    function monthStart() {
      const now = new Date();
      return now.getUTCFullYear() + "-" + String(now.getUTCMonth() + 1).padStart(2, "0") + "-01";
    }

    function periodSpend(provider) {
      if (!provider || (provider.totalUsd == null && !(provider.days || []).length)) return null;
      const start = provider.periodStart || monthStart();
      const days = (provider.days || []).filter((day) => day.date >= start);
      const spent = days.length
        ? days.reduce((sum, day) => sum + Number(day.usd || 0), 0)
        : Number(provider.totalUsd);
      return { spent, limit: provider.limitUsd || 0, days };
    }

    const MONTHS = "января февраля марта апреля мая июня июля августа сентября октября ноября декабря".split(" ");

    function parseTime(value) {
      if (value == null || value === "") return null;
      if (typeof value === "number" || /^\d+$/.test(String(value))) {
        const n = Number(value);
        return new Date(n > 1e12 ? n : n * 1000);
      }
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function formatDate(value) {
      const date = parseTime(value);
      if (!date) return "";
      return date.getUTCDate() + " " + MONTHS[date.getUTCMonth()] + " " + date.getUTCFullYear();
    }

    function nextMonth(isoDate) {
      const [year, month] = isoDate.split("-").map(Number);
      return new Date(Date.UTC(year, month, 1)).toISOString();
    }

    function limitCard(title, cost, limit, start, end) {
      if (cost == null || !start || !end) return meter(title, "—", "Пока нет данных", 0, true);
      const hasLimit = Number(limit) > 0;
      const pct = hasLimit ? cost / limit * 100 : 0;
      const dates = formatDate(start) + " — " + formatDate(end);
      const sub = hasLimit ? dates + " · " + pct.toFixed(0) + "% от " + money(limit) : dates;
      return meter(title, money(cost), sub, pct, !hasLimit, hasLimit);
    }

    function quotaRow(label, percent, valueText) {
      const row = document.createElement("div");
      row.className = "quota";
      const head = document.createElement("div");
      head.className = "quota-head";
      const name = document.createElement("span");
      name.textContent = label;
      const value = document.createElement("span");
      value.textContent = valueText;
      head.append(name, value);
      const track = document.createElement("div");
      track.className = "track";
      const fill = document.createElement("div");
      fill.className = "fill";
      fill.style.width = Math.max(0, Math.min(100, percent || 0)) + "%";
      track.appendChild(fill);
      row.append(head, track);
      return row;
    }

    function cursorCard(cursor) {
      const card = document.createElement("article");
      card.className = "card";
      const title = document.createElement("h2");
      title.textContent = "Cursor";
      const sub = document.createElement("p");
      sub.className = "sub";
      sub.textContent = formatDate(cursor.cycleStart) + " — " + formatDate(cursor.cycleEnd);
      card.append(title, sub);
      if (cursor.modelsPercent != null) {
        card.appendChild(quotaRow("Cursor Models", cursor.modelsPercent, Math.round(cursor.modelsPercent) + "%"));
      }
      if (cursor.otherPercent != null) {
        card.appendChild(quotaRow("Other Models", cursor.otherPercent, Math.round(cursor.otherPercent) + "%"));
      }
      if (cursor.onDemandLimitUsd != null) {
        const used = cursor.onDemandUsd || 0;
        const pct = cursor.onDemandLimitUsd ? used / cursor.onDemandLimitUsd * 100 : 0;
        card.appendChild(quotaRow("On-demand", pct, money(used) + " / " + money(cursor.onDemandLimitUsd)));
      }
      return card;
    }

    function meter(title, figure, sub, percent, empty, showTrack) {
      const card = document.createElement("article");
      card.className = "card" + (empty ? " empty" : "");
      const width = empty ? 0 : Math.max(0, Math.min(100, percent));
      const track = showTrack === false ? "" : "<div class=\"track\"><div class=\"fill\"></div></div>";
      card.innerHTML = "<h2></h2><p class=\"figure\"></p><p class=\"sub\"></p>" + track;
      card.querySelector("h2").textContent = title;
      card.querySelector(".figure").textContent = figure;
      card.querySelector(".sub").textContent = sub;
      const fill = card.querySelector(".fill");
      if (fill) fill.style.width = width + "%";
      return card;
    }

    function clear(id) {
      document.getElementById(id).replaceChildren();
    }

    function render(data) {
      document.getElementById("when").textContent = data.displayTime || "";
      const rail = data.railway || {};
      const bill = rail.billing;
      const openai = data.openai || {};
      const cursor = data.cursor || {};
      const meters = document.getElementById("meters");
      clear("meters");

      const railPeriod = bill && bill.period;
      if (bill && bill.currentUsd != null && railPeriod && railPeriod.start && railPeriod.end) {
        meters.appendChild(limitCard("Railway", bill.currentUsd, bill.progressTargetUsd, railPeriod.start, railPeriod.end));
      } else {
        meters.appendChild(meter("Railway", "—", "Пока нет данных", 0, true));
      }

      const openaiSpent = periodSpend(openai);
      if (openaiSpent != null) {
        const start = openai.periodStart || monthStart();
        meters.appendChild(limitCard("OpenAI", openaiSpent.spent, openaiSpent.limit, start, openai.periodEnd || nextMonth(start)));
      } else {
        meters.appendChild(meter("OpenAI", "—", "Пока нет данных", 0, true));
      }

      if (cursor.cycleStart && cursor.cycleEnd && (cursor.modelsPercent != null || cursor.otherPercent != null || cursor.onDemandLimitUsd != null)) {
        meters.appendChild(cursorCard(cursor));
      } else {
        meters.appendChild(meter("Cursor", "—", "Пока нет данных", 0, true));
      }

      const monthNames = "январь февраль март апрель май июнь июль август сентябрь октябрь ноябрь декабрь".split(" ");
      function monthTitle(isoMonth) {
        const month = Number(String(isoMonth || "").split("-")[1]);
        return monthNames[month - 1] || "";
      }
      function monthColumn(label, total, railwayAmount, openaiAmount) {
        const column = document.createElement("div");
        const name = document.createElement("p");
        name.className = "month-label";
        name.textContent = label;
        const figure = document.createElement("div");
        figure.className = "month-total";
        figure.textContent = money(total);
        const stack = document.createElement("div");
        stack.className = "stack";
        const railwayShare = total ? railwayAmount / total * 100 : 0;
        const openaiShare = total ? openaiAmount / total * 100 : 0;
        const railwayBar = document.createElement("i");
        railwayBar.className = "rail";
        railwayBar.style.width = railwayShare + "%";
        const openaiBar = document.createElement("i");
        openaiBar.className = "ai";
        openaiBar.style.width = openaiShare + "%";
        stack.append(railwayBar, openaiBar);
        const fine = document.createElement("div");
        fine.className = "fine";
        fine.innerHTML = "<span><i class=\"dot\" style=\"background:#9a3412\"></i>Railway " + money(railwayAmount) + "</span><span><i class=\"dot\" style=\"background:#1d4e89\"></i>OpenAI " + money(openaiAmount) + "</span>";
        column.append(name, figure, stack, fine);
        return column;
      }
      function reconcileOpenAi(spend, provider) {
        if (!spend) return spend;
        const rows = (spend.projects || []).map((project) => ({
          ...project,
          name: project.name === "Default project" ? "Не привязано" : project.name,
          railway: { ...project.railway },
          openai: { ...project.openai },
        }));
        const period = periodSpend(provider);
        if (period) {
          const attributed = rows.reduce((sum, project) => sum + Number(project.openai.current || 0), 0);
          const gap = Math.round((period.spent - attributed) * 100) / 100;
          if (Math.abs(gap) >= 0.01) {
            let row = rows.find((project) => project.name === "Не привязано");
            if (!row) {
              row = {
                name: "Не привязано",
                current: 0,
                previous: 0,
                railway: { current: 0, previous: 0 },
                openai: { current: 0, previous: 0 },
              };
              rows.push(row);
            }
            row.openai.current = Math.round((Number(row.openai.current || 0) + gap) * 100) / 100;
            row.current = Math.round((Number(row.railway.current || 0) + row.openai.current) * 100) / 100;
          }
        }
        return { ...spend, projects: rows };
      }
      const spend = reconcileOpenAi(data.projectSpend, openai);
      const projects = document.getElementById("projects");
      clear("projects");
      if (spend && (spend.projects || []).length) {
        const currentMonth = monthTitle(spend.currentMonth);
        const previousMonth = monthTitle(spend.previousMonth);
        for (const project of spend.projects) {
          const block = document.createElement("section");
          block.className = "project";
          const title = document.createElement("h4");
          title.textContent = project.name === "Default project" ? "Не привязано" : project.name;
          const compare = document.createElement("div");
          compare.className = "compare";
          compare.append(
            monthColumn(currentMonth, project.current, project.railway.current, project.openai.current),
            monthColumn(previousMonth, project.previous, project.railway.previous, project.openai.previous)
          );
          block.append(title, compare);
          projects.appendChild(block);
        }
        document.getElementById("pace").textContent = "";
      } else {
        document.getElementById("pace").textContent = "";
      }

      const days = (openaiSpent && openaiSpent.days) || [];
      const daysSection = document.getElementById("days-section");
      if (days.length) {
        daysSection.hidden = false;
        const peak = Math.max(...days.map((day) => day.usd), 0.0001);
        const chart = document.getElementById("days");
        clear("days");
        for (const day of days) {
          const bar = document.createElement("i");
          bar.style.height = Math.max(4, day.usd / peak * 120) + "px";
          bar.title = day.date + " " + money(day.usd);
          chart.appendChild(bar);
        }
        const shown = days.reduce((sum, day) => sum + Number(day.usd || 0), 0);
        document.getElementById("days-note").textContent =
          formatDate(days[0].date) + " — " + formatDate(days[days.length - 1].date) + " · " + money(shown);
      } else {
        daysSection.hidden = true;
      }

      const body = document.getElementById("services");
      clear("services");
      const serviceRows = data.serviceCosts || (rail.services || []).map((service) => ({
        project: service.project,
        service: service.service,
        railwayWeek: service.weekUsd,
        railwayDay: service.dayUsd,
        openaiWeek: null,
        openaiDay: null,
      }));
      for (const service of serviceRows) {
        const tr = document.createElement("tr");
        const cells = [
          service.project,
          service.service,
          money(service.railwayWeek || 0),
          money(service.railwayDay || 0),
          service.openaiWeek == null ? "—" : money(service.openaiWeek),
          service.openaiDay == null ? "—" : money(service.openaiDay),
        ];
        cells.forEach((text, index) => {
          const td = document.createElement("td");
          if (index >= 2) td.className = "num";
          td.textContent = text;
          tr.appendChild(td);
        });
        body.appendChild(tr);
      }
    }

    fetch("data.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("data");
        return response.json();
      })
      .then(render)
      .catch(() => render(embedded));
  </script>
</body>
</html>
