<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentiment Calendar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    h1 { margin: 0 0 0.75rem; font-size: 1.4rem; }
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 1rem;
      max-width: 42rem;
    }
    .month-nav h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      flex: 1;
    }
    .month-nav button {
      min-width: 7.5rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    .month-nav button:hover:not(:disabled) { background: #f4f7fb; }
    .month-nav button:disabled { color: #888; cursor: default; background: #f6f6f6; }
    #month-highlights {
      max-width: 42rem;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      background: #f8fafc;
    }
    #month-highlights h3 { margin: 0 0 0.45rem; font-size: 0.95rem; }
    .hl-row { margin: 0.2rem 0; font-size: 0.95rem; }
    .hl-label, .popover-label { color: #555; margin-right: 0.4rem; font-weight: 600; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 8px; }
    .day { border: 1px solid #ccc; padding: 8px; border-radius: 6px; font-size: 13px; line-height:1.3; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .day:focus { outline: 2px solid #0078d4; outline-offset: 2px; }
    .self-praise {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0.05rem 0 0.3rem;
    }
    .self-praise-count {
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    .self-praise-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #222;
      margin-top: 0.2rem;
      text-shadow: none;
    }
    .day-line { font-size: 12px; }
    .topic-preview { margin-top: 0.25rem; font-size: 11px; color: #222; }
    .day.sentiment-blend {
      color: #111;
      text-shadow: 0 0 8px rgba(255,255,255,0.9);
      background-image: var(--day-blend);
      background-repeat: no-repeat;
      background-size: cover;
    }
    .sentiment-pos { background:#e6ffe6; }
    .sentiment-neg { background:#ffe6e6; }
    .sentiment-neu { background:#f0f0f0; }
    .sentiment-mixed { background:#fff9e6; }
    .sentiment-empty { background:#fafafa; color:#888; }
    #status { margin-bottom: 1rem; min-height: 1.2em; }
    #empty-state { margin: 0 0 1rem; color: #555; }
    body.day-detail-open { overflow: hidden; }
    #day-detail {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.25rem 1rem;
    }
    #day-detail[hidden] { display: none; }
    .day-detail-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
    }
    .day-detail-panel {
      position: relative;
      z-index: 1;
      width: min(44rem, 100%);
      max-height: calc(100vh - 2.5rem);
      overflow: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
      padding: 1rem 1.15rem 1.25rem;
    }
    .day-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 0.85rem;
    }
    .day-detail-header h2 { margin: 0; font-size: 1.2rem; }
    #day-detail-close {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 6px;
      font: inherit;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    .day-detail-body section { margin: 0 0 1rem; }
    .day-detail-body h3 { margin: 0 0 0.45rem; font-size: 0.95rem; }
    .day-primary { padding: 0.65rem 0.75rem; background: #f8fafc; border: 1px solid #d0d5dd; border-radius: 8px; }
    #day-secondary-list, #day-posts-list { margin: 0; padding: 0; list-style: none; }
    #day-secondary-list li, .day-post {
      display: grid;
      gap: 0.15rem;
      padding: 0.55rem 0.15rem;
      border-bottom: 1px solid #eee;
    }
    .day-story-topic, .day-post-title { font-weight: 600; }
    .day-story-name, .day-post-meta { color: #555; font-size: 0.9rem; }
    .day-post-snippet { color: #333; font-size: 0.9rem; }
    .day-post-link { color: inherit; text-decoration: none; display: grid; gap: 0.15rem; }
    .day-post-link:hover .day-post-title { text-decoration: underline; }
    .day-post-count { color: #666; font-weight: 500; }
    .day-empty, .day-detail-loading { color: #555; }
    .day-detail-error { color: #b30000; }
  </style>
<script>globalThis.__STATIC_DATA_URL__ = "/trump/data";</script>
</head>
<body>
  <h1>Social Media Sentiment Calendar</h1>
  <nav id="month-nav" class="month-nav" aria-label="Month navigation">
    <button type="button" id="prev-month" aria-label="Previous month">Previous</button>
    <h2 id="month-label">Loading…</h2>
    <button type="button" id="next-month" aria-label="Next month">Next</button>
  </nav>
  <section id="month-highlights" hidden aria-live="polite">
    <h3 id="month-highlights-heading">Month so far</h3>
    <p class="hl-row"><span class="hl-label">Trending topic</span> <span id="month-trending-topic">—</span></p>
    <p class="hl-row"><span class="hl-label">Trending name</span> <span id="month-trending-name">—</span></p>
  </section>
  <div id="status">Loading…</div>
  <p id="empty-state" hidden>No data available for this month</p>
  <div id="grid" hidden></div>
  <script type="module" src="./bundle.js?v=day-detail-2"></script>
</body>
</html>
