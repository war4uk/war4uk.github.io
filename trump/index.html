<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentiment Calendar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    h1 { margin: 0 0 0.75rem; font-size: 1.4rem; }
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 1rem;
      max-width: 42rem;
    }
    .month-nav h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      flex: 1;
    }
    .month-nav button {
      min-width: 7.5rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    .month-nav button:hover:not(:disabled) { background: #f4f7fb; }
    .month-nav button:disabled { color: #888; cursor: default; background: #f6f6f6; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(120px,1fr)); gap: 8px; }
    .day { border: 1px solid #ccc; padding: 6px; border-radius: 4px; font-size: 13px; line-height:1.3; cursor: pointer; }
    .day:focus { outline: 2px solid #0078d4; outline-offset: 2px; }
    .day.sentiment-blend {
      color: #111;
      text-shadow: 0 0 8px rgba(255,255,255,0.9);
      background-image: var(--day-blend);
      background-repeat: no-repeat;
      background-size: cover;
    }
    .sentiment-pos { background:#e6ffe6; }
    .sentiment-neg { background:#ffe6e6; }
    .sentiment-neu { background:#f0f0f0; }
    .sentiment-mixed { background:#fff9e6; }
    .sentiment-empty { background:#fafafa; color:#888; }
    #status { margin-bottom: 1rem; min-height: 1.2em; }
    #empty-state { margin: 0 0 1rem; color: #555; }
    #day-popover { position: absolute; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); min-width: 180px; font-size: 12px; z-index: 10; }
    .popover-title { font-weight: 600; margin-bottom: 4px; }
    .popover-row { margin: 2px 0; }
    .popover-loading { color: #555; }
    .popover-error { color: #b30000; }
  </style>
<script>globalThis.__STATIC_DATA_URL__ = "/trump/data";</script>
</head>
<body>
  <h1>Social Media Sentiment Calendar</h1>
  <nav id="month-nav" class="month-nav" aria-label="Month navigation">
    <button type="button" id="prev-month" aria-label="Previous month">Previous</button>
    <h2 id="month-label">Loading…</h2>
    <button type="button" id="next-month" aria-label="Next month">Next</button>
  </nav>
  <div id="status">Loading…</div>
  <p id="empty-state" hidden>No data available for this month</p>
  <div id="grid" hidden></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
