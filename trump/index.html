<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentiment Calendar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    h1 { margin: 0 0 0.75rem; font-size: 1.4rem; }
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 1rem;
      max-width: 42rem;
    }
    .month-nav h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      flex: 1;
    }
    .month-nav button {
      min-width: 7.5rem;
      padding: 0.45rem 0.75rem;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    .month-nav button:hover:not(:disabled) { background: #f4f7fb; }
    .month-nav button:disabled { color: #888; cursor: default; background: #f6f6f6; }
    #month-highlights {
      max-width: 42rem;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      background: #f8fafc;
    }
    #month-highlights h3 { margin: 0 0 0.45rem; font-size: 0.95rem; }
    .hl-row { margin: 0.2rem 0; font-size: 0.95rem; }
    .hl-label, .popover-label { color: #555; margin-right: 0.4rem; font-weight: 600; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 8px; }
    .day { border: 1px solid #ccc; padding: 8px; border-radius: 6px; font-size: 13px; line-height:1.3; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .day:focus { outline: 2px solid #0078d4; outline-offset: 2px; }
    .self-praise {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0.05rem 0 0.3rem;
    }
    .self-praise-count {
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    .self-praise-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #222;
      margin-top: 0.2rem;
      text-shadow: none;
    }
    .day-line { font-size: 12px; }
    .topic-preview { margin-top: 0.25rem; font-size: 11px; color: #222; }
    .day.sentiment-blend {
      color: #111;
      text-shadow: 0 0 8px rgba(255,255,255,0.9);
      background-image: var(--day-blend);
      background-repeat: no-repeat;
      background-size: cover;
    }
    .sentiment-pos { background:#e6ffe6; }
    .sentiment-neg { background:#ffe6e6; }
    .sentiment-neu { background:#f0f0f0; }
    .sentiment-mixed { background:#fff9e6; }
    .sentiment-empty { background:#fafafa; color:#888; }
    #status { margin-bottom: 1rem; min-height: 1.2em; }
    #empty-state { margin: 0 0 1rem; color: #555; }
    #day-popover { position: absolute; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); min-width: 220px; max-width: 28rem; font-size: 12px; z-index: 10; }
    .popover-title { font-weight: 600; margin-bottom: 4px; }
    .popover-row { margin: 2px 0; }
    .popover-loading { color: #555; }
    .popover-error { color: #b30000; }
  </style>
<script>globalThis.__STATIC_DATA_URL__ = "/trump/data";</script>
</head>
<body>
  <h1>Social Media Sentiment Calendar</h1>
  <nav id="month-nav" class="month-nav" aria-label="Month navigation">
    <button type="button" id="prev-month" aria-label="Previous month">Previous</button>
    <h2 id="month-label">Loading…</h2>
    <button type="button" id="next-month" aria-label="Next month">Next</button>
  </nav>
  <section id="month-highlights" hidden aria-live="polite">
    <h3 id="month-highlights-heading">Month so far</h3>
    <p class="hl-row"><span class="hl-label">Trending topic</span> <span id="month-trending-topic">—</span></p>
    <p class="hl-row"><span class="hl-label">Trending name</span> <span id="month-trending-name">—</span></p>
  </section>
  <div id="status">Loading…</div>
  <p id="empty-state" hidden>No data available for this month</p>
  <div id="grid" hidden></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
